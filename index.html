<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1000 1000%22%3E%3Crect width=%221000%22 height=%221000%22 rx=%22220%22 fill=%22#FFB020%22/%3E%3Cpath fill=%22#D81E41%22 d=%22M500.0,295.6 C527.4,264.8 582.3,250.8 637.2,253.6 C737.4,259.2 793.9,320.8 785.5,404.8 C777.0,516.8 670.1,679.2 571.3,788.4 C541.2,820.3 458.8,820.3 428.7,788.4 C329.9,679.2 239.2,516.8 231.2,404.8 C223.2,320.8 276.4,259.2 362.8,253.6 C417.7,250.8 472.6,264.8 500.0,295.6 Z %22/%3E%3Cg fill=%22#FFF8F0%22%3E%3Cpath d=%22M0,-45.1 C17.4,-22.6 33.0,0.0 33.0,15.6 C33.0,34.7 17.4,45.1 0,45.1 C-17.4,45.1 -33.0,34.7 -33.0,15.6 C-33.0,0.0 -17.4,-22.6 0,-45.1 Z%22 transform=%22translate(511.0,421.6) rotate(4)%22/%3E%3Cpath d=%22M0,-45.1 C17.4,-22.6 33.0,0.0 33.0,15.6 C33.0,34.7 17.4,45.1 0,45.1 C-17.4,45.1 -33.0,34.7 -33.0,15.6 C-33.0,0.0 -17.4,-22.6 0,-45.1 Z%22 transform=%22translate(384.8,544.8) rotate(-8)%22/%3E%3Cpath d=%22M0,-45.1 C17.4,-22.6 33.0,0.0 33.0,15.6 C33.0,34.7 17.4,45.1 0,45.1 C-17.4,45.1 -33.0,34.7 -33.0,15.6 C-33.0,0.0 -17.4,-22.6 0,-45.1 Z%22 transform=%22translate(609.8,589.6) rotate(6)%22/%3E%3C/g%3E%3Cpath fill=%22#2F9E57%22 d=%22M484.4,295.6 a15.6,15.6 0 1,0 31.2,0 a15.6,15.6 0 1,0 -31.2,0 Z%22/%3E%3Cpath fill=%22#2F9E57%22 d=%22M500.0,295.6 C545.7,252.2 544.7,174.1 506.9,122.0 C471.0,174.1 454.3,252.2 500.0,295.6 Z%22/%3E%3Cpath fill=%22#2F9E57%22 d=%22M508.7,295.6 C571.1,307.4 633.8,249.3 657.1,180.9 C597.0,190.4 525.4,234.4 508.7,295.6 Z%22/%3E%3Cpath fill=%22#2F9E57%22 d=%22M491.3,295.6 C476.4,235.5 411.6,188.2 349.8,186.2 C374.8,247.0 430.8,308.5 491.3,295.6 Z%22/%3E%3C/svg%3E">
<style>
:root{--g:#D81E41;--g2:#B8173A;--g3:#3A1620;--gold:#FFB020;--bronze:#A8431F;--ivory:#FFF8F0;--cream:#FFEFE4;--sand:#FFF3EA;--line:#F0D9CB;--ink:#3A1620;--muted:#6B4A50;--r:16px;
--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--serif:Fredoka,Inter,system-ui,sans-serif}
html[lang=ar]{--sans:"Noto Sans Arabic",Tahoma,sans-serif;--serif:"Noto Naskh Arabic","Noto Sans Arabic",serif}
html[lang=zh]{--sans:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;--serif:"Songti SC","Noto Serif SC","SimSun",Georgia,serif}
html[lang=ru]{--serif:Inter,system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--ivory);-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:clip}
html[lang=ar] body{line-height:1.75}
svg{display:block}
a{color:var(--g)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--g);color:#fff;padding:10px 16px;border-radius:8px;z-index:100;text-decoration:none}
.skip:focus{top:10px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.ltr{direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}
.eyebrow{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);font-weight:600;margin:0 0 12px}
html[lang=ar] .eyebrow,html[lang=zh] .eyebrow{letter-spacing:0;font-size:14px}
h2.title{margin:0 0 16px;font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.2vw,46px);line-height:1.12;color:var(--g);text-wrap:balance}
html[lang=ar] h2.title{font-weight:600;line-height:1.4}
.lead{margin:0;font-size:18px;line-height:1.65;color:var(--muted);max-width:660px}
section{padding:96px 0}
@media (max-width:640px){section{padding:68px 0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;font:600 15px var(--sans);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--g);color:#fff;box-shadow:0 10px 24px -8px rgba(216,30,65,.5)}
.btn-primary:hover{background:#7E1C30}
.btn-gold{background:var(--gold);color:var(--ink)}.btn-gold:hover{background:#FFC247}
.btn-ghost{background:transparent;color:var(--g);border-color:rgba(216,30,65,.35)}
.btn-ghost:hover{background:rgba(216,30,65,.06)}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,248,240,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;direction:ltr;white-space:nowrap;flex:none}
.logo .lg{height:54px;width:auto;display:block}
.right{display:flex;align-items:center;gap:6px}
.links{display:flex;align-items:center;gap:24px;font-size:14.5px;font-weight:500}
.links a{text-decoration:none;color:var(--ink);white-space:nowrap}
.links a:hover{color:var(--bronze)}
.links .btn{min-height:42px;padding:0 20px;color:#fff}
.links .btn:hover{color:#fff}
.langsel{position:relative}
.langsel select{appearance:none;-webkit-appearance:none;font:500 14px var(--sans);color:var(--g);background:transparent;border:1px solid var(--line);border-radius:999px;min-height:42px;padding:0 30px 0 36px;cursor:pointer;margin-inline-start:14px}
html[dir=rtl] .langsel select{padding:0 36px 0 30px}
.langsel svg{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--g)}
.langsel .globe{inset-inline-start:28px}.langsel .chev{inset-inline-end:11px}
.menu-btn{display:none;background:none;border:0;width:44px;height:44px;border-radius:10px;cursor:pointer;color:var(--g)}
@media (max-width:1020px){
  .menu-btn{display:grid;place-items:center}
  .links{position:absolute;top:68px;inset-inline:0;flex-direction:column;align-items:stretch;gap:0;background:var(--ivory);border-bottom:1px solid var(--line);padding:8px 24px 20px;display:none}
  .links.open{display:flex}
  .links a{padding:14px 0;border-bottom:1px solid var(--line)}
  .links .btn{margin-top:14px;justify-content:center}
  .langsel select{margin:0}.langsel .globe{inset-inline-start:12px}
}
@media (max-width:560px){.logo .lg{height:38px}.langsel select{padding:0 26px 0 32px}html[dir=rtl] .langsel select{padding:0 32px 0 26px}}

/* hero */
.hero{background:linear-gradient(180deg,#FBF6EF 0%,#F5ECE0 100%);padding:0;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:64px;align-items:center;padding-top:76px;padding-bottom:92px}
.hero .eyebrow{color:var(--bronze)}
.hero h1{margin:0 0 22px;font-family:var(--serif);font-weight:500;font-size:clamp(38px,5.4vw,66px);line-height:1.06;color:var(--ink);text-wrap:balance}
html[lang=ar] .hero h1{font-weight:600;line-height:1.32}
.hero h1 em{font-style:italic;color:var(--g)}
html[lang=ar] .hero h1 em,html[lang=zh] .hero h1 em{font-style:normal}
.hero p.sub{margin:0 0 32px;font-size:18.5px;line-height:1.65;color:var(--muted);max-width:540px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.hv{position:relative;padding-bottom:40px;padding-inline-start:40px}
.pic{position:relative;overflow:hidden;background:linear-gradient(135deg,#B8323F,#D81E41)}
.pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.pic>img.ok{opacity:1}
.hv-main{height:500px;border-radius:32px;box-shadow:0 40px 80px -24px rgba(216,30,65,.5)}
.hv-card{position:absolute;bottom:0;inset-inline-start:0;width:46%;height:190px;border-radius:22px;border:6px solid #FBF6EF;box-shadow:0 24px 50px -12px rgba(0,0,0,.35);background:linear-gradient(160deg,#D49A4E,#7A3E1C)}
.hv-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55))}
.hv-chip{position:absolute;z-index:2;bottom:12px;inset-inline-start:14px;display:flex;align-items:center;gap:8px;color:#fff;font-size:14px}
.hv-chip i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
@media (max-width:880px){
  .hero .wrap{grid-template-columns:1fr;gap:36px;padding-top:44px;padding-bottom:56px}
  .hv{padding-inline-start:24px;padding-bottom:30px}.hv-main{height:320px;border-radius:24px}
  .hv-card{width:52%;height:130px;border-width:5px;border-radius:18px}.hv-chip{font-size:12.5px;bottom:9px;inset-inline-start:10px}
}

/* trust strip */
.strip{background:var(--g3);color:#F3E3E4}
.strip .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.strip div{padding:24px 20px;border-inline-start:1px solid rgba(255,255,255,.09);font-size:14px;line-height:1.45}
.strip div:first-child{border-inline-start:0}
.strip b{display:block;color:#fff;font-size:15px;font-weight:600;margin-bottom:2px}
@media (max-width:880px){.strip .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.strip div:nth-child(3){border-inline-start:0}.strip div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.09)}}

/* strawberry feature */
.spot{background:var(--sand)}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(216,30,65,.3)}
.feat .pic{min-height:460px}
.feat .tag{position:absolute;z-index:2;top:18px;inset-inline-start:18px;background:rgba(255,255,255,.94);color:var(--g);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px}
.feat .bd{padding:40px 40px 38px;display:flex;flex-direction:column;gap:16px}
.feat h3{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(26px,3vw,34px);line-height:1.15;color:var(--g)}
html[lang=ar] .feat h3{font-weight:600;line-height:1.4}
.feat p{margin:0;font-size:16px;line-height:1.65;color:var(--muted)}
.feat dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:14.5px;border-top:1px solid var(--line);padding-top:18px}
.feat dt{color:var(--muted)}.feat dd{margin:0;font-weight:500}
.feat .btn{align-self:flex-start;margin-top:auto}
@media (max-width:880px){.feat{grid-template-columns:1fr}.feat .pic{min-height:260px}.feat .bd{padding:28px 24px}}

/* standard */
.band{margin:0 0 52px;height:clamp(220px,30vw,360px);border-radius:24px}
.std-lead{margin-top:6px}
.a1grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:44px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px}
.card .num{font-family:var(--serif);font-size:15px;color:var(--bronze);margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:18px;color:var(--g)}
.card p{margin:0;font-size:15px;line-height:1.6;color:var(--muted)}
@media (max-width:980px){.a1grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.a1grid{grid-template-columns:1fr}}
h2.title.aud-h{margin-top:80px;font-size:clamp(26px,3vw,34px)}
.aud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:30px}
.aud div{border-top:2px solid var(--g);padding-top:16px}
.aud h3{margin:0 0 6px;font-size:18px;color:var(--g)}
.aud p{margin:0;font-size:15px;line-height:1.6;color:var(--muted)}
@media (max-width:880px){.aud{grid-template-columns:1fr;gap:22px}}

/* products */
.products{background:#fff;border-block:1px solid var(--line)}
.tabs{display:inline-flex;background:var(--sand);border-radius:999px;padding:4px;margin:32px 0 28px}
.tab{border:0;background:none;padding:0 24px;min-height:44px;border-radius:999px;font:600 14.5px var(--sans);color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--g);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.pgrid[data-g=veg]{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1020px){.pgrid,.pgrid[data-g=veg]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.pgrid,.pgrid[data-g=veg]{grid-template-columns:1fr}}
.prod{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--ivory);display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.prod:hover{transform:translateY(-4px);box-shadow:0 22px 44px -22px rgba(58,22,32,.35)}
.prod .swatch{height:176px;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 16px;color:#fff;position:relative;overflow:hidden}
.prod .swatch::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(transparent,rgba(0,0,0,.5));pointer-events:none}
.prod .swatch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.prod .swatch img.ok{opacity:1}
.prod .swatch span{position:relative;z-index:1;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.45)}
html[lang=ar] .prod .swatch span,html[lang=zh] .prod .swatch span{letter-spacing:.04em}
.prod .body{padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.prod h3{margin:0;font-family:var(--serif);font-weight:500;font-size:23px;color:var(--g)}
html[lang=ar] .prod h3{font-weight:600}
.prod dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.prod dt{color:var(--muted)}.prod dd{margin:0;font-weight:500}
.prod dd.ltr{text-align:start}
html[dir=rtl] .prod dd.ltr{text-align:end}
.prod .q{margin-top:auto;align-self:flex-start;background:none;border:0;padding:6px 0;font:600 14px var(--sans);color:var(--g);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.note{margin:24px 0 0;font-size:13.5px;color:var(--muted)}

/* markets */
.mk{background:var(--cream)}
.mk-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.mk-row span{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px;color:var(--g)}
.mk-row span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}

/* process */
.steps{list-style:none;margin:44px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));counter-reset:s}
.steps li{position:relative;padding-inline-end:18px}
.steps li::before{counter-increment:s;content:"0" counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--g);color:var(--gold);font-family:var(--serif);font-size:16px;margin-bottom:16px;position:relative;z-index:1}
.steps li::after{content:"";position:absolute;top:22px;inset-inline-start:44px;inset-inline-end:0;height:1px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps h3{margin:0 0 6px;font-size:16.5px;color:var(--g)}
.steps p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
@media (max-width:880px){.steps{grid-template-columns:1fr;gap:26px}.steps li{padding:0;padding-inline-start:62px}.steps li::before{position:absolute;inset-inline-start:0;top:0;margin:0}.steps li::after{inset-inline-start:21px;inset-inline-end:auto;top:48px;bottom:-26px;width:1px;height:auto}}

/* terms */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:44px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px}
.panel h3{margin:0 0 18px;font-family:var(--serif);font-weight:500;font-size:24px;color:var(--g)}
html[lang=ar] .panel h3{font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;font-size:15px;line-height:1.5}
.checks li svg{flex:none;margin-top:2px}
table.terms{width:100%;border-collapse:collapse;font-size:15px}
table.terms th,table.terms td{text-align:start;padding:13px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.terms th{font-weight:500;color:var(--muted);width:38%;padding-inline-end:16px}
table.terms tr:last-child>*{border-bottom:0}
@media (max-width:880px){.two{grid-template-columns:1fr}}

/* faq */
.faq{max-width:820px;margin-top:36px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:22px 0;padding-inline-end:40px;font-size:17px;font-weight:600;color:var(--g);position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;inset-inline-end:4px;top:16px;font:500 28px var(--serif);color:var(--bronze)}
details[open] summary::after{content:"–"}
details p{margin:0 0 22px;font-size:15.5px;line-height:1.7;color:var(--muted);max-width:720px}

/* contact */
.contact{background:var(--g3);color:#fff}
.contact .eyebrow{color:var(--gold)}
.contact h2.title{color:#fff}.contact .lead{color:#F0DADC}
.cgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:56px}
.cinfo{margin-top:28px;display:grid;gap:14px;font-size:16px;color:#F0DADC}
.cinfo a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,176,32,.7)}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
label{display:flex;flex-direction:column;gap:7px;font-size:13.5px;font-weight:500;color:#F0DADC}
input,select,textarea{font:400 16px var(--sans);padding:12px 14px;border-radius:10px;border:1px solid rgba(255,248,240,.22);background:rgba(255,248,240,.07);color:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
select option{color:var(--ink)}
.full{grid-column:1/-1}
.formnote{font-size:13px;color:#E3C5C9;margin:0}
.formerr{font-size:14px;color:#FFD9B0;margin:0}
@media (max-width:880px){.cgrid{grid-template-columns:1fr;gap:36px}}
@media (max-width:520px){form{grid-template-columns:1fr}}

/* footer + sticky */
.wa{position:fixed;inset-inline-end:22px;bottom:22px;z-index:61;width:58px;height:58px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 26px rgba(37,211,102,.45);transition:transform .15s}.wa:hover{transform:scale(1.06)}
@media (max-width:860px){.wa{bottom:80px;inset-inline-end:16px;width:54px;height:54px}}

footer{background:var(--g3);color:#D9B9BD;font-size:14px;border-top:1px solid rgba(255,255,255,.09)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:28px;padding-bottom:28px}
footer a{color:#F3E3E4;text-decoration:none}
.credits{font-size:12.5px;color:#B58E94}
.sticky{display:none}
@media (max-width:880px){
  .sticky{display:block;position:fixed;inset-inline:12px;bottom:12px;z-index:60;opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s}
  .sticky.on{opacity:1;pointer-events:auto;transform:none}
  .sticky .btn{width:100%;box-shadow:0 8px 24px rgba(58,22,32,.35)}
  footer{padding-bottom:76px}
}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.btn,.prod{transition:none}}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{group=b.dataset.g;grid.dataset.g=group;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));grid.querySelectorAll('.prod').forEach(e=>{e.hidden=e.dataset.g!==group})}));

document.querySelectorAll('[data-pick]').forEach(a=>a.addEventListener('click',()=>{prodSel.value=a.dataset.pick}));
const sticky=document.querySelector('.sticky'),contact=document.getElementById('contact');
addEventListener('scroll',()=>{const r=contact.getBoundingClientRect();sticky.classList.toggle('on',scrollY>560&&r.top>innerHeight)},{passive:true});
const mb=document.querySelector('.menu-btn'),links=document.getElementById('links');
mb.addEventListener('click',()=>{const o=links.classList.toggle('open');mb.setAttribute('aria-expanded',o)});
links.addEventListener('click',e=>{if(e.target.tagName==='A'){links.classList.remove('open');mb.setAttribute('aria-expanded','false')}});
document.getElementById('quote').addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,err=document.getElementById('formerr');
  if(!f.name.value.trim()||!f.company.value.trim()||!f.email.value.trim()||!f.email.validity.valid){err.textContent=t('f_req');err.hidden=false;return}
  err.hidden=true;
  const prod=f.product.value==='p_straw'?I18N.en.iqf_h3:(I18N.en[f.product.value]||f.product.value),vol=I18N.en[f.volume.value]||f.volume.value;
  const body='Name: '+f.name.value+'\nCompany: '+f.company.value+'\nEmail: '+f.email.value+'\nDestination: '+f.country.value+'\nProduct: '+prod+'\nVolume: '+vol+'\nSite language: '+L+'\n\n'+f.notes.value;
  location.href='mailto:info@raaqfoods.com?subject='+encodeURIComponent('Quote request — '+prod+' — '+f.company.value)+'&body='+encodeURIComponent(body);
});
let start='en';
try{const s=localStorage.getItem('raaq_lang');if(s&&I18N[s])start=s;else{const n=(navigator.language||'en').slice(0,2).toLowerCase();if(I18N[n])start=n}}catch(e){const n=(navigator.language||'en').slice(0,2).toLowerCase();if(I18N[n])start=n}
const qp=new URLSearchParams(location.search).get('lang');if(qp&&I18N[qp])start=qp;
apply(start);
}
</script>
<script>(function(){if(!('IntersectionObserver' in window))return;var els=document.querySelectorAll('section:not(.hero) .title,section:not(.hero) .lead,.feat,.card,.steps li,.aud>div,.panel,.mk-row');var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -6% 0px'});els.forEach(function(el,i){el.classList.add('rv');el.style.transitionDelay=(i%3)*70+'ms';io.observe(el)})})();</script>
